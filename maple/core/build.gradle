evaluationDependsOn(':server')

apply plugin: 'java-library'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

dependencies {
    api project(':wz')
    api project(':server')
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    testImplementation 'junit:junit:4.13.2'
    testImplementation files(project(':server').sourceSets.test.output)
    testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
    testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

test {
    workingDir = project(':server').projectDir // server scripts live there
    maxHeapSize = '2g'
    systemProperty 'maple.idleTest', System.getProperty('maple.idleTest') ?: 'false'
    systemProperty 'maple.synthetic', "${projectDir}/build/synthetic-wz"
    environment 'MAPLE_XML_WZ', System.getenv('MAPLE_XML_WZ') ?: ''
    environment 'MAPLE_BIN_WZ', System.getenv('MAPLE_BIN_WZ') ?: ''
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// A build stamp shown on the start and error screens, so it's clear which build a phone is running.
def buildStampDir = layout.buildDirectory.dir('generated/buildStamp')
tasks.register('buildStamp') {
    def out = buildStampDir.map { it.file('maple-build.txt') }
    outputs.upToDateWhen { false }
    outputs.file(out)
    doLast {
        def version = rootProject.file('VERSION').exists() ? rootProject.file('VERSION').text.trim() : 'dev'
        out.get().asFile.parentFile.mkdirs()
        out.get().asFile.text = 'v' + version + ' (built ' + new Date().format('yyyy-MM-dd HH:mm') + ')'
    }
}
sourceSets.main.resources.srcDir(buildStampDir)
processResources.dependsOn 'buildStamp'
