apply plugin: 'java'
apply plugin: 'application'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    // ANGLE: OpenGL ES on top of DirectX, for Windows PCs without usable OpenGL (e.g. Remote Desktop).
    implementation "com.badlogicgames.gdx:gdx-lwjgl3-angle:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
}

application {
    mainClass = 'maple.desktop.DesktopLauncher'
}

// Play on PC:  gradlew desktop:run -PwzDir=C:\msclassicv83\MapleStory
tasks.named('run') {
    args = [wzDir.toString()]
    workingDir = rootProject.file('.')
    jvmArgs '-Xmx2g', '-XX:ErrorFile=' + rootProject.file('crash-report.log').absolutePath
    if (project.hasProperty('safe')) jvmArgs '-Dmaple.safe=true'
    if (project.hasProperty('gl')) jvmArgs "-Dmaple.gl=${project.property('gl')}"
    if (System.getProperty('os.name').toLowerCase().contains('mac')) jvmArgs '-XstartOnFirstThread'
}

// Check your WZ files and print a report:  gradlew desktop:wzcheck -PwzDir=C:\msclassicv83\MapleStory
tasks.register('wzcheck', JavaExec) {
    group = 'maple'
    description = 'Reads the WZ files and reports anything the game cannot understand.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'maple.desktop.WzCheck'
    args = [wzDir.toString()]
    jvmArgs '-Xmx2g'
}

// Structure of the UI/physics data (no images):  gradlew desktop:wzdump -PwzDir=...
tasks.register('wzdump', JavaExec) {
    group = 'maple'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'maple.desktop.WzDump'
    args = [wzDir.toString(), rootProject.file('wz-structure.txt').absolutePath]
    jvmArgs '-Xmx2g'
}
